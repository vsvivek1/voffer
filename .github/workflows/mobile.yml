name: Mobile app

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the signed bundle to this Play Console track (leave empty to only build)"
        type: choice
        options: ["", internal, alpha, beta, production]
        default: ""
      release_status:
        description: "Release status on that track"
        type: choice
        options: [draft, completed]
        default: draft

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VOFFER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "VOFFER_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Signing with the Voffer upload key."
          else
            echo "::warning::VOFFER_KEYSTORE_BASE64 is not set, so this bundle is debug-signed and cannot go to the Play Store."
          fi

      - name: Build app bundle
        env:
          VOFFER_KEYSTORE_PASSWORD: ${{ secrets.VOFFER_KEYSTORE_PASSWORD }}
          VOFFER_KEY_ALIAS: ${{ secrets.VOFFER_KEY_ALIAS }}
          VOFFER_KEY_PASSWORD: ${{ secrets.VOFFER_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build appbundle --release \
            --build-number=$((1000 + GITHUB_RUN_NUMBER)) \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: voffer-android-${{ github.run_number }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/mapping/release/mapping.txt
            apps/mobile/build/symbols
          if-no-files-found: error

      - name: Upload to Play Console
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.voffer.voffer
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.release_status }}
